name: jobgoblin

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobgoblin
      POSTGRES_PASSWORD: jobgoblin
      POSTGRES_DB: jobgoblin
    # Localhost only (ADR 0019): never reachable from the LAN or the Internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Only runs on first init of an empty volume — see the file itself and
      # README.md for the manual one-time step on an already-initialized volume.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobgoblin -d jobgoblin"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://jobgoblin:jobgoblin@postgres:5432/jobgoblin
    # Localhost only (ADR 0019): the unauthenticated read-only jobs API must not
    # be reachable from the LAN or the Internet. Uvicorn still listens on
    # 0.0.0.0 inside the container.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
