[project]
name = "job-goblin"
version = "0.1.0"
description = "JobGoblin backend — job aggregation and market intelligence platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    # Direct dependency (not just transitively installed via httpx/dev
    # extras) — app/normalization/company.py::normalize_domain() requires
    # IDNA2008/UTS #46 validation and mapping (uts46=True) for company-domain
    # identity matching (docs/DATA_MODEL.md's `companies.domain`); Python's
    # stdlib "idna" codec only implements the older IDNA2003 algorithm and
    # mishandles some inputs UTS #46 accepts. BSD-3-Clause license. Remove if
    # normalize_domain() is ever rewritten without IDNA/UTS46 conversion.
    "idna==3.19",
    # Direct dependency (not just transitively installed) --
    # app/normalization/taxonomy.py's YAML taxonomy loader
    # (backend/app/taxonomy/skills.yaml) needs a real YAML parser; the
    # stdlib has none. MIT license. `yaml.safe_load` alone does not reject
    # duplicate mapping keys (silent last-wins) -- the loader wraps a
    # custom `SafeLoader` subclass to fail closed on that instead of
    # relying on this dependency's own default behavior.
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

# asyncpg ships no py.typed marker/stubs. Used directly (not only via
# SQLAlchemy's "postgresql+asyncpg" dialect string) by the Workflow v3.2
# migration-matrix module, which issues CREATE DATABASE/DROP DATABASE
# outside SQLAlchemy's ORM layer.
[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

# PyYAML ships no py.typed marker/stubs. Used directly by
# app/normalization/taxonomy.py's YAML taxonomy loader.
[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
